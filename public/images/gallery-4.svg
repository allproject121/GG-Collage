      <stop offset="0%" stop-color="#091525"/>
      <stop offset="60%" stop-color="#0f2440"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="stageGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A84E"/>
      <stop offset="50%" stop-color="#a8882e"/>
      <stop offset="100%" stop-color="#7a6420"/>
    </linearGradient>
    <linearGradient id="curtainGrad" x1="0" y1="0" x2="1" y2="0">
