    <radialGradient id="spotlightConv" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="rgba(200,168,78,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <filter id="shadow4">
