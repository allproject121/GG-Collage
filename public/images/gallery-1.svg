    </filter>
    <linearGradient id="flagGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8A84E"/>
      <stop offset="100%" stop-color="#091525"/>
    </linearGradient>
  </defs>

