<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8e4e0"/>
      <stop offset="100%" stop-color="#d0ccc8"/>
    </linearGradient>
    <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c8c4c0"/>
      <stop offset="100%" stop-color="#a8a4a0"/>
    </linearGradient>
    <linearGradient id="deskGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a3a"/>
      <stop offset="100%" stop-color="#6a4a2a"/>
    </linearGradient>
    <linearGradient id="boardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3a1a"/>
      <stop offset="100%" stop-color="#0a2a0a"/>
    </linearGradient>
    <filter id="shadow3">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="ceilingGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0ece8"/>
      <stop offset="100%" stop-color="#e0dcd8"/>
    </linearGradient>
  </defs>

  <!-- Ceiling -->
  <rect width="800" height="600" fill="url(#ceilingGrad)"/>

  <!-- Back wall -->
  <rect x="0" y="30" width="800" height="390" fill="url(#wallGrad)"/>
  <!-- Wall panels -->
  <line x1="0" y1="150" x2="800" y2="150" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="0" y1="250" x2="800" y2="250" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="200" y1="30" x2="200" y2="420" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="400" y1="30" x2="400" y2="420" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="600" y1="30" x2="600" y2="420" stroke="#b8b4b0" stroke-width="0.5"/>

  <!-- Floor -->
  <rect x="0" y="420" width="800" height="180" fill="url(#floorGrad)"/>
  <!-- Floor tiles -->
  <line x1="0" y1="440" x2="800" y2="440" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="0" y1="480" x2="800" y2="480" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="0" y1="500" x2="800" y2="500" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="0" y1="540" x2="800" y2="540" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="0" y1="560" x2="800" y2="560" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="100" y1="420" x2="100" y2="600" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="200" y1="420" x2="200" y2="600" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="300" y1="420" x2="300" y2="600" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="400" y1="420" x2="400" y2="600" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="500" y1="420" x2="500" y2="600" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="600" y1="420" x2="600" y2="600" stroke="#b8b4b0" stroke-width="0.5"/>
  <line x1="700" y1="420" x2="700" y2="600" stroke="#b8b4b0" stroke-width="0.5"/>

  <!-- Clock on wall -->
  <circle cx="700" cy="100" r="25" fill="#fff" stroke="#333" stroke-width="2" filter="url(#shadow3)"/>
  <circle cx="700" cy="100" r="23" fill="none" stroke="#C8A84E" stroke-width="1"/>
  <line x1="700" y1="100" x2="700" y2="82" stroke="#333" stroke-width="2"/>
  <line x1="700" y1="100" x2="712" y2="100" stroke="#333" stroke-width="1.5"/>
  <circle cx="700" cy="100" r="2" fill="#C8A84E"/>
  <!-- Hour markers -->
  <text x="700" y="80" text-anchor="middle" font-size="6" fill="#333">12</text>
  <text x="722" y="103" text-anchor="middle" font-size="6" fill="#333">3</text>
  <text x="700" y="126" text-anchor="middle" font-size="6" fill="#333">6</text>
  <text x="678" y="103" text-anchor="middle" font-size="6" fill="#333">9</text>

  <!-- Notice board -->
  <rect x="50" y="60" width="200" height="130" fill="#8a6a3a" rx="3" filter="url(#shadow3)"/>
  <rect x="55" y="65" width="190" height="120" fill="none" stroke="#C8A84E" stroke-width="1" rx="2"/>
  <rect x="65" y="70" width="170" height="110" fill="#fff" rx="1"/>
  <!-- Notice text -->
  <text x="150" y="90" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#333" font-weight="bold">IMPORTANT NOTICE</text>
  <line x1="75" y1="95" x2="225" y2="95" stroke="#333" stroke-width="0.5"/>
  <text x="150" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#555">Exam Hall Rules</text>
  <text x="150" y="120" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#777">No electronic devices</text>
  <text x="150" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#777">Silence must be maintained</text>
  <text x="150" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="5" fill="#777">Report at 10:00 AM</text>
  <text x="150" y="160" text-anchor="middle" font-family="Arial,sans-serif" font-size="6" fill="#C8A84E" opacity="0.7">GG College</text>

  <!-- Blackboard -->
  <rect x="280" y="55" width="240" height="160" fill="url(#boardGrad)" rx="4" filter="url(#shadow3)"/>
  <rect x="285" y="60" width="230" height="150" fill="none" stroke="#C8A84E" stroke-width="1.5" rx="2"/>
  <!-- Chalk text -->
  <text x="400" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#fff" opacity="0.9">UPSC / MPSC</text>
  <text x="400" y="115" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#fff" opacity="0.8">PRELIMS EXAM</text>
  <line x1="320" y1="125" x2="480" y2="125" stroke="#fff" stroke-width="0.5" opacity="0.5"/>
  <text x="400" y="140" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#C8A84E">Duration: 3 Hours</text>
  <text x="400" y="155" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#C8A84E">Max Marks: 400</text>

  <!-- Ceiling fans -->
  <!-- Fan 1 -->
  <g transform="translate(200,30)">
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#888" stroke-width="2"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#888" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#666"/>
  </g>
  <!-- Fan 2 -->
  <g transform="translate(400,30)">
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#888" stroke-width="2"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#888" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#666"/>
  </g>
  <!-- Fan 3 -->
