  <g>
    <rect x="220" y="360" width="160" height="55" fill="url(#deskGrad)" rx="3" filter="url(#shadow3)"/>
    <circle cx="255" cy="375" r="7" fill="#3a2a1a"/>
    <rect x="250" y="382" width="10" height="18" fill="#fff" rx="1"/>
    <circle cx="295" cy="375" r="7" fill="#2a1a0a"/>
    <rect x="290" y="382" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <circle cx="335" cy="375" r="7" fill="#3a2a1a"/>
    <rect x="330" y="382" width="10" height="18" fill="#fff" rx="1"/>
    <rect x="240" y="400" width="15" height="8" fill="#fff" rx="1"/>
    <rect x="280" y="400" width="15" height="8" fill="#fff" rx="1"/>
    <rect x="320" y="400" width="15" height="8" fill="#fff" rx="1"/>
  </g>

  <g>
    <rect x="420" y="360" width="160" height="55" fill="url(#deskGrad)" rx="3" filter="url(#shadow3)"/>
    <circle cx="455" cy="375" r="7" fill="#2a1a0a"/>
    <rect x="450" y="382" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <circle cx="495" cy="375" r="7" fill="#3a2a1a"/>
    <rect x="490" y="382" width="10" height="18" fill="#fff" rx="1"/>
    <circle cx="535" cy="375" r="7" fill="#2a1a0a"/>
    <rect x="530" y="382" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <rect x="440" y="400" width="15" height="8" fill="#fff" rx="1"/>
    <rect x="480" y="400" width="15" height="8" fill="#fff" rx="1"/>
    <rect x="520" y="400" width="15" height="8" fill="#fff" rx="1"/>
  </g>

  <g>
    <rect x="610" y="360" width="160" height="55" fill="url(#deskGrad)" rx="3" filter="url(#shadow3)"/>
    <circle cx="645" cy="375" r="7" fill="#3a2a1a"/>
    <rect x="640" y="382" width="10" height="18" fill="#fff" rx="1"/>
    <circle cx="685" cy="375" r="7" fill="#2a1a0a"/>
    <rect x="680" y="382" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <circle cx="725" cy="375" r="7" fill="#3a2a1a"/>
    <rect x="720" y="382" width="10" height="18" fill="#fff" rx="1"/>
    <rect x="630" y="400" width="15" height="8" fill="#fff" rx="1"/>
    <rect x="670" y="400" width="15" height="8" fill="#fff" rx="1"/>
    <rect x="710" y="400" width="15" height="8" fill="#fff" rx="1"/>
