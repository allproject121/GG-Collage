  <!-- Invigilator at back -->
  <circle cx="780" cy="265" r="10" fill="#2a1a0a"/>
  <rect x="775" y="275" width="10" height="30" fill="#1a3a5c" rx="2"/>

  <!-- Invigilator at front -->
  <circle cx="20" cy="445" r="9" fill="#2a1a0a"/>
  <rect x="15" y="454" width="10" height="25" fill="#1a3a5c" rx="2"/>

  <!-- "EXAM IN PROGRESS" sign -->
  <rect x="310" y="220" width="180" height="22" fill="#CC0000" rx="3" filter="url(#shadow3)"/>
  <text x="400" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#fff" font-weight="bold" letter-spacing="2">EXAM IN PROGRESS</text>

  <!-- GG College watermark on wall -->
  <text x="400" y="200" text-anchor="middle" font-family="Georgia,serif" font-size="30" fill="#C8A84E" opacity="0.08" font-weight="bold">GG COLLEGE</text>

  <!-- Frame border -->
