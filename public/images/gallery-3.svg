    <rect x="100" y="310" width="15" height="10" fill="#fff" rx="1"/>
    <rect x="140" y="310" width="15" height="10" fill="#fff" rx="1"/>
    <rect x="170" y="310" width="15" height="10" fill="#fff" rx="1"/>
