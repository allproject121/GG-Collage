    <rect x="490" y="292" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <circle cx="535" cy="285" r="7" fill="#3a2a1a"/>
    <rect x="530" y="292" width="10" height="18" fill="#fff" rx="1"/>
    <circle cx="575" cy="285" r="7" fill="#2a1a0a"/>
    <rect x="570" y="292" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <rect x="440" y="310" width="15" height="10" fill="#fff" rx="1"/>
    <rect x="480" y="310" width="15" height="10" fill="#fff" rx="1"/>
    <rect x="520" y="310" width="15" height="10" fill="#fff" rx="1"/>
    <rect x="560" y="310" width="15" height="10" fill="#fff" rx="1"/>
  </g>

  <!-- Row 4 -->
  <g>
    <rect x="610" y="270" width="160" height="60" fill="url(#deskGrad)" rx="3" filter="url(#shadow3)"/>
    <rect x="610" y="270" width="160" height="60" fill="none" stroke="#C8A84E" stroke-width="0.5" rx="3" opacity="0.3"/>
    <circle cx="645" cy="285" r="7" fill="#2a1a0a"/>
    <rect x="640" y="292" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <circle cx="685" cy="285" r="7" fill="#3a2a1a"/>
    <rect x="680" y="292" width="10" height="18" fill="#fff" rx="1"/>
    <circle cx="725" cy="285" r="7" fill="#2a1a0a"/>
    <rect x="720" y="292" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <circle cx="765" cy="285" r="7" fill="#3a2a1a"/>
    <rect x="760" y="292" width="10" height="18" fill="#fff" rx="1"/>
    <rect x="630" y="310" width="15" height="10" fill="#fff" rx="1"/>
    <rect x="670" y="310" width="15" height="10" fill="#fff" rx="1"/>
    <rect x="710" y="310" width="15" height="10" fill="#fff" rx="1"/>
    <rect x="750" y="310" width="15" height="10" fill="#fff" rx="1"/>
  </g>

