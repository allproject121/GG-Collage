  <g>
    <rect x="40" y="360" width="160" height="55" fill="url(#deskGrad)" rx="3" filter="url(#shadow3)"/>
    <circle cx="75" cy="375" r="7" fill="#2a1a0a"/>
    <rect x="70" y="382" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <circle cx="115" cy="375" r="7" fill="#3a2a1a"/>
    <rect x="110" y="382" width="10" height="18" fill="#fff" rx="1"/>
    <circle cx="155" cy="375" r="7" fill="#2a1a0a"/>
    <rect x="150" y="382" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <rect x="60" y="400" width="15" height="8" fill="#fff" rx="1"/>
    <rect x="100" y="400" width="15" height="8" fill="#fff" rx="1"/>
    <rect x="140" y="400" width="15" height="8" fill="#fff" rx="1"/>
