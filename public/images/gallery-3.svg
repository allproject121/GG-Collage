    <rect x="110" y="292" width="10" height="18" fill="#C8A84E" rx="1" opacity="0.8"/>
    <!-- Student 3 -->
    <circle cx="155" cy="285" r="7" fill="#3a2a1a"/>
    <rect x="150" y="292" width="10" height="18" fill="#fff" rx="1"/>
