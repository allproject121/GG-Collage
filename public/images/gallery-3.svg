    <rect x="420" y="270" width="160" height="60" fill="none" stroke="#C8A84E" stroke-width="0.5" rx="3" opacity="0.3"/>
    <circle cx="455" cy="285" r="7" fill="#3a2a1a"/>
    <rect x="450" y="292" width="10" height="18" fill="#fff" rx="1"/>
