<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Admin Login | St. Gonsalo Garcia College</title>  <meta name="robots" content="noindex, nofollow">  <link rel="preconnect" href="https://fonts.googleapis.com">  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">  <link rel="stylesheet" href="../css/style.css">  <link rel="stylesheet" href="../css/animations.css">  <link rel="stylesheet" href="../css/components.css">  <link rel="stylesheet" href="../css/responsive.css">  <link rel="stylesheet" href="../css/accessibility.css"></head><body class="login-page">  <div class="login-card">    <div class="logo">      <img src="../images/GG-College-Logo.svg" alt="GG College Logo">      <h2>Admin Login</h2>      <p style="font-size:0.85rem;color:var(--color-text-light);margin-top:0.25rem;">St. Gonsalo Garcia College</p>    </div>    <form id="loginForm">      <div class="form-group">        <label for="username">Username</label>        <input type="text" id="username" name="username" placeholder="Enter your username" required autocomplete="username">      </div>      <div class="form-group">        <label for="password">Password</label>        <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">      </div>      <button type="submit" class="btn btn-primary">Login</button>      <div id="loginError" style="color:#dc3545;font-size:0.85rem;margin-top:0.5rem;display:none;"></div>    </form>    <script>      document.getElementById('loginForm')?.addEventListener('submit', async function(e) {        e.preventDefault();        const btn = this.querySelector('button[type="submit"]');        const errDiv = document.getElementById('loginError');        btn.disabled = true; btn.textContent = 'Logging in...';        errDiv.style.display = 'none';        try {          const res = await fetch('/api/login', {            method:'POST',            headers:{'Content-Type':'application/json'},            credentials: 'same-origin',            body: JSON.stringify({ username: this.username.value, password: this.password.value })          });          const data = await res.json();          if (res.ok) {            window.location.href = 'dashboard.html';          } else {            errDiv.textContent = data.error || 'Invalid credentials';            errDiv.style.display = 'block';          }        } catch { errDiv.textContent = 'Network error'; errDiv.style.display = 'block'; }        finally { btn.disabled = false; btn.textContent = 'Login'; }      });    </script>    <div style="text-align:center;margin-top:1rem;">      <a href="#" style="font-size:0.85rem;color:var(--color-primary-light);">Forgot Password?</a>    </div>    <div style="text-align:center;margin-top:0.75rem;padding-top:0.75rem;border-top:1px solid var(--color-border);">      <a href="../index.html" style="font-size:0.85rem;"><i class="fas fa-arrow-left"></i> Back to Home</a>    </div>  </div>  <script src="../js/animations.js"></script>  <script src="../js/navigation.js"></script>  <script src="../js/gallery.js"></script>  <script src="../js/forms.js"></script>  <script src="../js/search.js"></script>  <script src="../js/accessibility.js"></script>  <script src="../js/main.js"></script></body></html>
